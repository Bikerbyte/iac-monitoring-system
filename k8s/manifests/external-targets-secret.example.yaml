# External VM scrape targets, consumed by Prometheus via
# additionalScrapeConfigsSecret in k8s/helm/values.yaml.
#
# Copy to external-targets-secret.yaml and edit before applying:
#   cp external-targets-secret.example.yaml external-targets-secret.yaml
#   kubectl -n monitoring apply -f external-targets-secret.yaml
#
# The 'external-targets.yaml' key contains a list of Prometheus scrape_config
# entries. This is what makes the hybrid VM + k8s monitoring story work:
# kube-prometheus-stack scrapes pods via ServiceMonitor; everything below
# is plain VM Node Exporter / monitor-agent.
apiVersion: v1
kind: Secret
metadata:
  name: iac-external-targets
  namespace: monitoring
type: Opaque
stringData:
  external-targets.yaml: |
    - job_name: vm-node-exporter
      static_configs:
        - targets:
            - 10.0.1.10:9100
            - 10.0.1.11:9100
          labels:
            source: vm

    - job_name: vm-monitor-agent
      static_configs:
        - targets:
            - 10.0.1.10:8000
            - 10.0.1.11:8000
          labels:
            source: vm
