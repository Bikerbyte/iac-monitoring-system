apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-agent
  namespace: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: monitor-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: monitor-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: monitor-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitor-agent
    spec:
      serviceAccountName: monitor-agent
      hostPID: true
      hostNetwork: false
      containers:
        - name: agent
          image: monitor-agent:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8000
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: agent-logs
              mountPath: /var/log
      volumes:
        - name: agent-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: monitor-agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: monitor-agent
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
