groups:
  - name: linux-node-alerts
    rules:
      - alert: InstanceDown
        expr: up{job=~"monitor-agent|node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Instance metrics endpoint is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is down"
          description: "Node Exporter on {{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage on {{ $labels.instance }} has been above 85% for more than 5 minutes."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage on {{ $labels.instance }} has been above 90% for more than 5 minutes."

      - alert: DiskAlmostFull
        expr: (1 - (node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk almost full"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has been above 85% usage for more than 5 minutes."

      - alert: HighLoadAverage
        expr: node_load5{job="node-exporter"} > count by (instance) (node_cpu_seconds_total{job="node-exporter",mode="idle"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High load average"
          description: "5-minute load average on {{ $labels.instance }} has been higher than CPU count for more than 5 minutes."

