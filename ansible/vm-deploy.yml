---
- name: Deploy monitoring agent + node exporter to Linux VMs
  hosts: monitoring_agents
  gather_facts: true
  become: true

  roles:
    - role: monitor_agent
    - role: node_exporter

- name: Deploy Prometheus and Grafana stack
  hosts: monitoring_stack
  gather_facts: false
  become: true

  vars:
    monitoring_stack_dir: /opt/iac-monitoring-stack
    prometheus_image: prom/prometheus:v2.54.1
    grafana_image: grafana/grafana:11.2.0
    alertmanager_image: prom/alertmanager:v0.27.0
    grafana_admin_user: admin
    grafana_admin_password: admin

  tasks:
    - name: Require Docker on control node
      ansible.builtin.command: docker version --format '{% raw %}{{.Server.Version}}{% endraw %}'
      register: docker_version
      changed_when: false
      become: false

    - name: Create monitoring stack directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ monitoring_stack_dir }}"
        - "{{ monitoring_stack_dir }}/rules"
        - "{{ monitoring_stack_dir }}/grafana/provisioning/datasources"
        - "{{ monitoring_stack_dir }}/grafana/provisioning/dashboards"
        - "{{ monitoring_stack_dir }}/grafana/dashboards"

    - name: Deploy Alertmanager config
      ansible.builtin.template:
        src: templates/alertmanager.yml.j2
        dest: "{{ monitoring_stack_dir }}/alertmanager.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Recreate monitoring stack

    - name: Deploy Prometheus alert rules
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ monitoring_stack_dir }}/rules/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/files/prometheus/rules/*.yml') }}"
      notify: Recreate monitoring stack

    - name: Deploy Prometheus scrape config
      ansible.builtin.template:
        src: templates/vm-prometheus.yml.j2
        dest: "{{ monitoring_stack_dir }}/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Recreate monitoring stack

    - name: Deploy Grafana Prometheus datasource
      ansible.builtin.copy:
        src: files/grafana/provisioning/datasources/prometheus.yml
        dest: "{{ monitoring_stack_dir }}/grafana/provisioning/datasources/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Recreate monitoring stack

    - name: Deploy Grafana dashboard provider
      ansible.builtin.copy:
        src: files/grafana/provisioning/dashboards/dashboard.yml
        dest: "{{ monitoring_stack_dir }}/grafana/provisioning/dashboards/dashboard.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Recreate monitoring stack

    - name: Deploy Grafana dashboards
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ monitoring_stack_dir }}/grafana/dashboards/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/files/grafana/dashboards/*.json') }}"
      notify: Recreate monitoring stack

    - name: Deploy docker-compose.yml for monitoring stack
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ monitoring_stack_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Recreate monitoring stack

    - name: Start monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_stack_dir }}"
        state: present

  handlers:
    - name: Recreate monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_stack_dir }}"
        state: present
        recreate: always
