---
- name: Deploy monitoring agent
  hosts: monitoring_agents
  become: true

  vars:
    agent_app_dir: /opt/monitor-agent
    agent_config_dir: /etc/monitor-agent
    agent_venv_dir: /opt/monitor-agent/venv
    agent_log_file: /var/log/monitor-agent.log

  tasks:
    - name: Install OS packages for Python agent
      ansible.builtin.package:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present

    - name: Create agent application directory
      ansible.builtin.file:
        path: "{{ agent_app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create agent config directory
      ansible.builtin.file:
        path: "{{ agent_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy monitoring agent script
      ansible.builtin.copy:
        src: ../agent/agent.py
        dest: "{{ agent_app_dir }}/agent.py"
        owner: root
        group: root
        mode: "0755"
      notify: Restart monitor agent

    - name: Deploy monitoring agent config
      ansible.builtin.copy:
        src: ../agent/config.yml
        dest: "{{ agent_config_dir }}/config.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart monitor agent

    - name: Deploy Python requirements
      ansible.builtin.copy:
        src: ../requirements.txt
        dest: "{{ agent_app_dir }}/requirements.txt"
        owner: root
        group: root
        mode: "0644"

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: "{{ agent_app_dir }}/requirements.txt"
        virtualenv: "{{ agent_venv_dir }}"
        virtualenv_command: python3 -m venv

    - name: Ensure log file exists
      ansible.builtin.file:
        path: "{{ agent_log_file }}"
        state: touch
        owner: root
        group: root
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Deploy systemd service
      ansible.builtin.copy:
        src: ../systemd/monitor-agent.service
        dest: /etc/systemd/system/monitor-agent.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart monitor agent

    - name: Enable and start monitor agent
      ansible.builtin.systemd:
        name: monitor-agent
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart monitor agent
      ansible.builtin.systemd:
        name: monitor-agent
        state: restarted
