---
- name: Deploy monitoring agent
  hosts: monitoring_agents
  gather_facts: true
  become: true

  vars:
    agent_app_dir: /opt/monitor-agent
    agent_config_dir: /etc/monitor-agent
    agent_venv_dir: /opt/monitor-agent/venv
    agent_log_file: /var/log/monitor-agent.log
    agent_config_src: ../agent/config.yml

  tasks:
    - name: Update apt package cache on Debian based hosts
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_pkg_mgr == "apt"

    - name: Install OS packages for Python agent
      ansible.builtin.package:
        name:
          - python3
          - python3-pip
          - python3-venv
          - logrotate
        state: present

    - name: Create agent application directory
      ansible.builtin.file:
        path: "{{ agent_app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create agent config directory
      ansible.builtin.file:
        path: "{{ agent_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy monitoring agent script
      ansible.builtin.copy:
        src: ../agent/agent.py
        dest: "{{ agent_app_dir }}/agent.py"
        owner: root
        group: root
        mode: "0755"
      notify: Restart monitor agent

    - name: Deploy monitoring agent config
      ansible.builtin.copy:
        src: "{{ agent_config_src }}"
        dest: "{{ agent_config_dir }}/config.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart monitor agent

    - name: Deploy Python requirements
      ansible.builtin.copy:
        src: ../requirements.txt
        dest: "{{ agent_app_dir }}/requirements.txt"
        owner: root
        group: root
        mode: "0644"

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: "{{ agent_app_dir }}/requirements.txt"
        virtualenv: "{{ agent_venv_dir }}"
        virtualenv_command: python3 -m venv

    - name: Ensure log file exists
      ansible.builtin.file:
        path: "{{ agent_log_file }}"
        state: touch
        owner: root
        group: root
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Deploy monitor agent logrotate config
      ansible.builtin.copy:
        src: files/logrotate/monitor-agent
        dest: /etc/logrotate.d/monitor-agent
        owner: root
        group: root
        mode: "0644"

    - name: Deploy systemd service
      ansible.builtin.copy:
        src: ../systemd/monitor-agent.service
        dest: /etc/systemd/system/monitor-agent.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart monitor agent

    - name: Enable and start monitor agent
      ansible.builtin.systemd:
        name: monitor-agent
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart monitor agent
      ansible.builtin.systemd:
        name: monitor-agent
        state: restarted

- name: Deploy Prometheus and Grafana stack
  hosts: monitoring_stack
  gather_facts: false
  become: true

  vars:
    monitoring_stack_dir: /opt/iac-monitoring-stack
    prometheus_image: prom/prometheus:v2.54.1
    grafana_image: grafana/grafana:11.2.0
    blackbox_image: prom/blackbox-exporter:v0.25.0
    grafana_admin_user: admin
    grafana_admin_password: admin

  tasks:
    - name: Check Docker CLI on control node
      ansible.builtin.shell: command -v docker
      register: docker_cli
      changed_when: false
      failed_when: false
      become: false

    - name: Require Docker on control node
      ansible.builtin.fail:
        msg: "Docker is required on the control node before deploying the local Prometheus/Grafana stack."
      when: docker_cli.rc != 0

    - name: Enable and start Docker on control node
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create monitoring stack directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ monitoring_stack_dir }}"
        - "{{ monitoring_stack_dir }}/grafana"
        - "{{ monitoring_stack_dir }}/grafana/provisioning"
        - "{{ monitoring_stack_dir }}/grafana/provisioning/datasources"
        - "{{ monitoring_stack_dir }}/grafana/provisioning/dashboards"
        - "{{ monitoring_stack_dir }}/grafana/dashboards"

    - name: Deploy Prometheus scrape config
      ansible.builtin.template:
        src: templates/server-prometheus.yml.j2
        dest: "{{ monitoring_stack_dir }}/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Prometheus

    - name: Deploy Grafana Prometheus datasource
      ansible.builtin.copy:
        src: files/grafana/provisioning/datasources/prometheus.yml
        dest: "{{ monitoring_stack_dir }}/grafana/provisioning/datasources/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Grafana

    - name: Deploy Grafana dashboard provider
      ansible.builtin.copy:
        src: files/grafana/provisioning/dashboards/dashboard.yml
        dest: "{{ monitoring_stack_dir }}/grafana/provisioning/dashboards/dashboard.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Grafana

    - name: Deploy Grafana system dashboards
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ monitoring_stack_dir }}/grafana/dashboards/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/files/grafana/dashboards/*.json') }}"
      notify: Restart Grafana

    - name: Deploy Docker target Grafana dashboards
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ monitoring_stack_dir }}/grafana/dashboards/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/files/docker-target/grafana/dashboards/*.json') }}"
      notify: Restart Grafana

    - name: Ensure monitoring Docker network exists
      ansible.builtin.shell: |
        docker network inspect iac-monitoring >/dev/null 2>&1 || docker network create iac-monitoring
      changed_when: false

    - name: Ensure Docker target network exists when Docker targets are configured
      ansible.builtin.shell: |
        docker network inspect "{{ iac_docker_target_network }}" >/dev/null 2>&1 || docker network create "{{ iac_docker_target_network }}"
      changed_when: false
      when: (iac_docker_target_app_targets | default([])) | length > 0

    - name: Check blackbox exporter container state
      ansible.builtin.shell: |
        docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' blackbox 2>/dev/null || true
      register: blackbox_state
      changed_when: false
      when: (iac_docker_target_app_targets | default([])) | length > 0

    - name: Start blackbox exporter container for Docker targets
      ansible.builtin.shell: |
        docker rm -f blackbox >/dev/null 2>&1 || true
        docker run -d \
          --name blackbox \
          --restart unless-stopped \
          --network iac-monitoring \
          "{{ blackbox_image }}"
        docker network connect "{{ iac_docker_target_network }}" blackbox >/dev/null 2>&1 || true
      when:
        - (iac_docker_target_app_targets | default([])) | length > 0
        - blackbox_state is defined
        - blackbox_state.stdout != "true"
      changed_when: true

    - name: Ensure blackbox exporter is attached to Docker target network
      ansible.builtin.shell: |
        docker network connect "{{ iac_docker_target_network }}" blackbox >/dev/null 2>&1 || true
      changed_when: false
      when:
        - (iac_docker_target_app_targets | default([])) | length > 0
        - blackbox_state is defined
        - blackbox_state.stdout == "true"

    - name: Check Prometheus container state
      ansible.builtin.shell: |
        set -o pipefail
        docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' prometheus 2>/dev/null || true
      args:
        executable: /bin/bash
      register: prometheus_state
      changed_when: false

    - name: Start Prometheus container
      ansible.builtin.shell: |
        docker rm -f prometheus >/dev/null 2>&1 || true
        docker run -d \
          --name prometheus \
          --restart unless-stopped \
          --network iac-monitoring \
          -p 9090:9090 \
          -v "{{ monitoring_stack_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
          "{{ prometheus_image }}" \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=7d
      when: prometheus_state.stdout != "true"
      changed_when: true

    - name: Check Grafana container state
      ansible.builtin.shell: |
        set -o pipefail
        docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' grafana 2>/dev/null || true
      args:
        executable: /bin/bash
      register: grafana_state
      changed_when: false

    - name: Start Grafana container
      ansible.builtin.shell: |
        docker rm -f grafana >/dev/null 2>&1 || true
        docker run -d \
          --name grafana \
          --restart unless-stopped \
          --network iac-monitoring \
          -p 3000:3000 \
          -e GF_SECURITY_ADMIN_USER="{{ grafana_admin_user }}" \
          -e GF_SECURITY_ADMIN_PASSWORD="{{ grafana_admin_password }}" \
          -e GF_USERS_ALLOW_SIGN_UP=false \
          -v "{{ monitoring_stack_dir }}/grafana/provisioning:/etc/grafana/provisioning:ro" \
          -v "{{ monitoring_stack_dir }}/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
          "{{ grafana_image }}"
      when: grafana_state.stdout != "true"
      changed_when: true

  handlers:
    - name: Restart Prometheus
      ansible.builtin.shell: |
        docker rm -f prometheus >/dev/null 2>&1 || true
        docker run -d \
          --name prometheus \
          --restart unless-stopped \
          --network iac-monitoring \
          -p 9090:9090 \
          -v "{{ monitoring_stack_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
          "{{ prometheus_image }}" \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=7d
      changed_when: true

    - name: Restart Grafana
      ansible.builtin.shell: |
        docker rm -f grafana >/dev/null 2>&1 || true
        docker run -d \
          --name grafana \
          --restart unless-stopped \
          --network iac-monitoring \
          -p 3000:3000 \
          -e GF_SECURITY_ADMIN_USER="{{ grafana_admin_user }}" \
          -e GF_SECURITY_ADMIN_PASSWORD="{{ grafana_admin_password }}" \
          -e GF_USERS_ALLOW_SIGN_UP=false \
          -v "{{ monitoring_stack_dir }}/grafana/provisioning:/etc/grafana/provisioning:ro" \
          -v "{{ monitoring_stack_dir }}/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
          "{{ grafana_image }}"
      changed_when: true
