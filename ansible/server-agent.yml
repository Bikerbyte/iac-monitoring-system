---
- name: Deploy monitoring agent
  hosts: monitoring_agents
  gather_facts: true
  become: true

  vars:
    agent_app_dir: /opt/monitor-agent
    agent_config_dir: /etc/monitor-agent
    agent_venv_dir: /opt/monitor-agent/venv
    agent_log_file: /var/log/monitor-agent.log
    agent_config_src: "{{ playbook_dir }}/../agent/config.yml"

  tasks:
    - name: Update apt package cache on Debian based hosts
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_pkg_mgr == "apt"

    - name: Install OS packages for Python agent
      ansible.builtin.package:
        name:
          - python3
          - python3-pip
          - python3-venv
          - logrotate
        state: present

    - name: Create agent application directory
      ansible.builtin.file:
        path: "{{ agent_app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create agent config directory
      ansible.builtin.file:
        path: "{{ agent_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy monitoring agent script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../agent/agent.py"
        dest: "{{ agent_app_dir }}/agent.py"
        owner: root
        group: root
        mode: "0755"
      notify: Restart monitor agent

    - name: Deploy monitoring agent config
      ansible.builtin.copy:
        src: "{{ agent_config_src }}"
        dest: "{{ agent_config_dir }}/config.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart monitor agent

    - name: Deploy Python requirements
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../requirements.txt"
        dest: "{{ agent_app_dir }}/requirements.txt"
        owner: root
        group: root
        mode: "0644"

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: "{{ agent_app_dir }}/requirements.txt"
        virtualenv: "{{ agent_venv_dir }}"
        virtualenv_command: python3 -m venv

    - name: Ensure log file exists
      ansible.builtin.file:
        path: "{{ agent_log_file }}"
        state: touch
        owner: root
        group: root
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Deploy monitor agent logrotate config
      ansible.builtin.copy:
        src: files/logrotate/monitor-agent
        dest: /etc/logrotate.d/monitor-agent
        owner: root
        group: root
        mode: "0644"

    - name: Deploy systemd service
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/monitor-agent.service"
        dest: /etc/systemd/system/monitor-agent.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart monitor agent

    - name: Enable and start monitor agent
      ansible.builtin.systemd:
        name: monitor-agent
        enabled: true
        state: started
        daemon_reload: true

    - name: Install Node Exporter for Linux host metrics
      ansible.builtin.include_role:
        name: node_exporter

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart monitor agent
      ansible.builtin.systemd:
        name: monitor-agent
        state: restarted

- name: Deploy Prometheus and Grafana stack
  hosts: monitoring_stack
  gather_facts: false
  become: true

  vars:
    monitoring_stack_dir: /opt/iac-monitoring-stack
    prometheus_image: prom/prometheus:v2.54.1
    grafana_image: grafana/grafana:11.2.0
    alertmanager_image: prom/alertmanager:v0.27.0
    grafana_admin_user: admin
    grafana_admin_password: admin

  tasks:
    - name: Require Docker on control node
      ansible.builtin.command: docker version --format '{% raw %}{{.Server.Version}}{% endraw %}'
      register: docker_version
      changed_when: false
      become: false

    - name: Create monitoring stack directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ monitoring_stack_dir }}"
        - "{{ monitoring_stack_dir }}/rules"
        - "{{ monitoring_stack_dir }}/grafana/provisioning/datasources"
        - "{{ monitoring_stack_dir }}/grafana/provisioning/dashboards"
        - "{{ monitoring_stack_dir }}/grafana/dashboards"

    - name: Deploy Alertmanager config
      ansible.builtin.template:
        src: templates/alertmanager.yml.j2
        dest: "{{ monitoring_stack_dir }}/alertmanager.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Recreate monitoring stack

    - name: Deploy Prometheus alert rules
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ monitoring_stack_dir }}/rules/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/files/prometheus/rules/*.yml') }}"
      notify: Recreate monitoring stack

    - name: Deploy Prometheus scrape config
      ansible.builtin.template:
        src: templates/server-prometheus.yml.j2
        dest: "{{ monitoring_stack_dir }}/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Recreate monitoring stack

    - name: Deploy Grafana Prometheus datasource
      ansible.builtin.copy:
        src: files/grafana/provisioning/datasources/prometheus.yml
        dest: "{{ monitoring_stack_dir }}/grafana/provisioning/datasources/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Recreate monitoring stack

    - name: Deploy Grafana dashboard provider
      ansible.builtin.copy:
        src: files/grafana/provisioning/dashboards/dashboard.yml
        dest: "{{ monitoring_stack_dir }}/grafana/provisioning/dashboards/dashboard.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Recreate monitoring stack

    - name: Deploy Grafana dashboards
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ monitoring_stack_dir }}/grafana/dashboards/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/files/grafana/dashboards/*.json') }}"
      notify: Recreate monitoring stack

    - name: Deploy docker-compose.yml for monitoring stack
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ monitoring_stack_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Recreate monitoring stack

    - name: Start monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_stack_dir }}"
        state: present

  handlers:
    - name: Recreate monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_stack_dir }}"
        state: present
        recreate: always
