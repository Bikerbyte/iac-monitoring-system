---
- name: Deploy local Docker monitoring simulation
  hosts: docker_target_stack
  gather_facts: false

  vars:
    docker_target_stack_dir: "{{ playbook_dir }}/../.docker-target/stack"
    docker_target_prometheus_image: prom/prometheus:v2.54.1
    docker_target_grafana_image: grafana/grafana:11.2.0
    docker_target_blackbox_image: prom/blackbox-exporter:v0.25.0
    docker_target_grafana_admin_user: admin
    docker_target_grafana_admin_password: admin

  tasks:
    - name: Create local Docker target stack directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ docker_target_stack_dir }}"
        - "{{ docker_target_stack_dir }}/grafana"
        - "{{ docker_target_stack_dir }}/grafana/provisioning"
        - "{{ docker_target_stack_dir }}/grafana/provisioning/datasources"
        - "{{ docker_target_stack_dir }}/grafana/provisioning/dashboards"
        - "{{ docker_target_stack_dir }}/grafana/dashboards"

    - name: Ensure Docker target network exists
      ansible.builtin.shell: |
        docker network inspect "{{ iac_docker_target_network }}" >/dev/null 2>&1 || docker network create "{{ iac_docker_target_network }}"
      changed_when: false

    - name: Deploy Docker target Prometheus config
      ansible.builtin.template:
        src: templates/docker-target-prometheus.yml.j2
        dest: "{{ docker_target_stack_dir }}/prometheus.yml"
        mode: "0644"
      notify: Restart Docker target Prometheus

    - name: Deploy Docker target Grafana datasource
      ansible.builtin.copy:
        src: files/docker-target/grafana/provisioning/datasources/prometheus.yml
        dest: "{{ docker_target_stack_dir }}/grafana/provisioning/datasources/prometheus.yml"
        mode: "0644"
      notify: Restart Docker target Grafana

    - name: Deploy Docker target Grafana dashboard provider
      ansible.builtin.copy:
        src: files/docker-target/grafana/provisioning/dashboards/dashboard.yml
        dest: "{{ docker_target_stack_dir }}/grafana/provisioning/dashboards/dashboard.yml"
        mode: "0644"
      notify: Restart Docker target Grafana

    - name: Deploy Docker target dashboards
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ docker_target_stack_dir }}/grafana/dashboards/{{ item | basename }}"
        mode: "0644"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/files/docker-target/grafana/dashboards/*.json') }}"
      notify: Restart Docker target Grafana

    - name: Check blackbox exporter container state
      ansible.builtin.shell: |
        docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' iac-lab-blackbox 2>/dev/null || true
      register: blackbox_state
      changed_when: false

    - name: Start blackbox exporter container
      ansible.builtin.shell: |
        docker rm -f iac-lab-blackbox >/dev/null 2>&1 || true
        docker run -d \
          --name iac-lab-blackbox \
          --restart unless-stopped \
          --network "{{ iac_docker_target_network }}" \
          -p "{{ iac_docker_target_blackbox_port }}:9115" \
          "{{ docker_target_blackbox_image }}"
      when: blackbox_state.stdout != "true"
      changed_when: true

    - name: Check Prometheus container state
      ansible.builtin.shell: |
        docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' iac-lab-prometheus 2>/dev/null || true
      register: prometheus_state
      changed_when: false

    - name: Start Prometheus container
      ansible.builtin.shell: |
        docker rm -f iac-lab-prometheus >/dev/null 2>&1 || true
        docker run -d \
          --name iac-lab-prometheus \
          --restart unless-stopped \
          --network "{{ iac_docker_target_network }}" \
          -p "{{ iac_docker_target_prometheus_port }}:9090" \
          -v "{{ docker_target_stack_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
          "{{ docker_target_prometheus_image }}" \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=2d
      when: prometheus_state.stdout != "true"
      changed_when: true

    - name: Check Grafana container state
      ansible.builtin.shell: |
        docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' iac-lab-grafana 2>/dev/null || true
      register: grafana_state
      changed_when: false

    - name: Start Grafana container
      ansible.builtin.shell: |
        docker rm -f iac-lab-grafana >/dev/null 2>&1 || true
        docker run -d \
          --name iac-lab-grafana \
          --restart unless-stopped \
          --network "{{ iac_docker_target_network }}" \
          -p "{{ iac_docker_target_grafana_port }}:3000" \
          -e GF_SECURITY_ADMIN_USER="{{ docker_target_grafana_admin_user }}" \
          -e GF_SECURITY_ADMIN_PASSWORD="{{ docker_target_grafana_admin_password }}" \
          -e GF_USERS_ALLOW_SIGN_UP=false \
          -v "{{ docker_target_stack_dir }}/grafana/provisioning:/etc/grafana/provisioning:ro" \
          -v "{{ docker_target_stack_dir }}/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
          "{{ docker_target_grafana_image }}"
      when: grafana_state.stdout != "true"
      changed_when: true

  handlers:
    - name: Restart Docker target Prometheus
      ansible.builtin.shell: |
        docker rm -f iac-lab-prometheus >/dev/null 2>&1 || true
        docker run -d \
          --name iac-lab-prometheus \
          --restart unless-stopped \
          --network "{{ iac_docker_target_network }}" \
          -p "{{ iac_docker_target_prometheus_port }}:9090" \
          -v "{{ docker_target_stack_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
          "{{ docker_target_prometheus_image }}" \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=2d
      changed_when: true

    - name: Restart Docker target Grafana
      ansible.builtin.shell: |
        docker rm -f iac-lab-grafana >/dev/null 2>&1 || true
        docker run -d \
          --name iac-lab-grafana \
          --restart unless-stopped \
          --network "{{ iac_docker_target_network }}" \
          -p "{{ iac_docker_target_grafana_port }}:3000" \
          -e GF_SECURITY_ADMIN_USER="{{ docker_target_grafana_admin_user }}" \
          -e GF_SECURITY_ADMIN_PASSWORD="{{ docker_target_grafana_admin_password }}" \
          -e GF_USERS_ALLOW_SIGN_UP=false \
          -v "{{ docker_target_stack_dir }}/grafana/provisioning:/etc/grafana/provisioning:ro" \
          -v "{{ docker_target_stack_dir }}/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
          "{{ docker_target_grafana_image }}"
      changed_when: true
