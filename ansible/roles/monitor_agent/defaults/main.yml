---
monitor_agent_app_dir: /opt/monitor-agent
monitor_agent_config_dir: /etc/monitor-agent
monitor_agent_venv_dir: /opt/monitor-agent/venv
monitor_agent_log_file: /var/log/monitor-agent.log

# Repo paths the role copies from. Default assumes the playbook lives at
# ansible/vm-deploy.yml so {{ playbook_dir }}/.. is the repo root.
monitor_agent_source_dir: "{{ playbook_dir }}/../agent"
monitor_agent_requirements_file: "{{ playbook_dir }}/../requirements.txt"
